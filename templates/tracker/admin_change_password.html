{% extends 'base.html' %}
{% block title %}Change Password — Admin{% endblock %}

{% block content %}
<div class="fade-in" style="max-width: 480px; margin: 0 auto;">
  <div class="mb-4">
    <h2 class="fw-bold mb-1" style="color: var(--text-main);">
      <i class="fas fa-key text-primary me-2"></i>Change Password
    </h2>
    <p class="text-muted small mb-0">Update your admin account password.</p>
  </div>

  {% for msg in messages %}
  <div class="alert alert-{{ msg.type }} alert-dismissible fade show rounded-4 border-0 shadow-sm mb-4" role="alert">
    <i class="fas {% if msg.type == 'success' %}fa-check-circle text-success{% else %}fa-exclamation-circle text-danger{% endif %} me-2"></i>
    {{ msg.text }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endfor %}

  <div class="card border-0 shadow-sm rounded-4 p-4" style="background: var(--card-bg);">
    <form method="POST" action="/admin/change-password/">
      <input type="hidden" name="_csrf" value="{{ csrfToken }}">

      <div class="mb-3">
        <label class="form-label small fw-bold text-muted">Current Password <span class="text-danger">*</span></label>
        <input type="password" name="current_password" class="form-control rounded-3 bg-light border-0"
               placeholder="Enter your current password" required autocomplete="current-password">
      </div>

      <div class="mb-3">
        <label class="form-label small fw-bold text-muted">New Password <span class="text-danger">*</span></label>
        <input type="password" name="new_password" class="form-control rounded-3 bg-light border-0"
               placeholder="At least 8 characters" required autocomplete="new-password">
        <div class="form-text text-muted small mt-1">
          Must be at least 8 characters. Cannot be entirely numeric.
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label small fw-bold text-muted">Confirm New Password <span class="text-danger">*</span></label>
        <input type="password" name="confirm_password" class="form-control rounded-3 bg-light border-0"
               placeholder="Repeat new password" required autocomplete="new-password">
      </div>

      <div class="d-flex gap-2 justify-content-end">
        <a href="/settings/" class="btn btn-light rounded-3 px-3">Cancel</a>
        <button type="submit" class="btn btn-primary rounded-3 px-4 shadow-sm">
          <i class="fas fa-save me-2"></i>Update Password
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
