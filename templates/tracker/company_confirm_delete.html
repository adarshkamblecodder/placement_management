{% extends 'base.html' %}
{% block content %}
<div class="d-flex align-items-center mb-4">
    <a href="{{ url('') }}" class="btn btn-light border me-3"><i class="fas fa-arrow-left"></i></a>
    <h2 class="text-slate-800 fw-bold mb-0">Confirm Delete</h2>
</div>
<div class="card p-4 text-center" style="max-width: 500px; margin: 0 auto;">
    <div class="text-danger mb-3">
        <i class="fas fa-exclamation-triangle fa-3x"></i>
    </div>
    <h4 class="mb-3">Are you sure?</h4>
    <p class="text-muted mb-4">Are you sure you want to delete company "<strong>{{ object.name }}</strong>"? This action cannot be undone.</p>
    <form method="post">
        <input type="hidden" name="_csrf" value="{{ csrfToken }}">
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url('') }}" class="btn btn-light border px-4">Cancel</a>
            <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
        </div>
    </form>
</div>
{% endblock %}
