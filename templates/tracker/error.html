{% extends 'base.html' %}
{% block content %}
<div class="row w-100 justify-content-center mt-5">
  <div class="col-md-6 col-lg-5">
    <div class="card p-5 text-center shadow-sm">
      <div class="text-danger mb-3">
        <i class="fas fa-shield-alt fa-3x"></i>
      </div>
      <h3 class="fw-bold mb-2">{{ error_title | default('Error ' ~ status) }}</h3>
      <p class="text-muted mb-4">{{ error_message | default('An unexpected error occurred.') }}</p>
      <div>
        <a href="/" class="btn btn-primary px-4">Go to Homepage</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
