{% extends 'base.html' %}
{% block content %}
<div class="row w-100 justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="text-center fw-bold mb-4">Student Registration</h3>
            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message.text }}</div>
            {% endfor %}
            {% endif %}
            <form method="post">
                <input type="hidden" name="_csrf" value="{{ csrfToken }}">
                <div class="mb-3">
                    <label class="form-label text-muted fw-bold">Student ID</label>
                    <input type="text" name="student_id" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted fw-bold">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 mt-3">Register</button>
            </form>
            <div class="mt-4 text-center">
                <a href="/login/">Already have an account? Log in</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
