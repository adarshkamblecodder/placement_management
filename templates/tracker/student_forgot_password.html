{% extends 'base.html' %}
{% block content %}
<div class="row w-100 justify-content-center mt-5">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4">
      <h3 class="text-center fw-bold mb-2">Forgot Password</h3>
      <p class="text-center text-muted small mb-4">Enter your Student ID or Email to receive a reset link.</p>

      {% for msg in messages %}
      <div class="alert alert-{{ msg.type }} alert-dismissible fade show" role="alert">
        {{ msg.text }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}

      <form method="post" action="/student/forgot-password/">
        <input type="hidden" name="_csrf" value="{{ csrfToken }}">
        <div class="mb-4">
          <label class="form-label text-muted fw-bold">Student ID / Email</label>
          <input type="text" name="identifier" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Send Reset Link</button>
      </form>
      <div class="mt-4 text-center">
        <a href="/login/">Back to login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
