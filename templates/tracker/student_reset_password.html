{% extends 'base.html' %}
{% block content %}
<div class="row w-100 justify-content-center mt-5">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4">
      <h3 class="text-center fw-bold mb-2">Reset Password</h3>
      <p class="text-center text-muted small mb-4">Set a new password for your account.</p>

      {% for msg in messages %}
      <div class="alert alert-{{ msg.type }} alert-dismissible fade show" role="alert">
        {{ msg.text }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}

      <form method="post" action="/student/reset-password/">
        <input type="hidden" name="_csrf" value="{{ csrfToken }}">
        <input type="hidden" name="studentId" value="{{ studentId }}">
        <input type="hidden" name="token" value="{{ token }}">
        <div class="mb-3">
          <label class="form-label text-muted fw-bold">New Password</label>
          <input type="password" name="new_password" class="form-control" required>
          <div class="form-text small">
            Must be 8+ chars, include uppercase, lowercase, number, special character.
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label text-muted fw-bold">Confirm New Password</label>
          <input type="password" name="confirm_password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Reset Password</button>
      </form>
      <div class="mt-4 text-center">
        <a href="/login/">Back to login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
