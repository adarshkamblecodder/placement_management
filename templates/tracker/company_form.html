{% extends 'base.html' %}
{% block content %}
<div class="d-flex align-items-center mb-4">
    <a href="{{ url('') }}" class="btn btn-light border me-3"><i class="fas fa-arrow-left"></i></a>
    <h2 class="text-slate-800 fw-bold mb-0">{% if object %}Edit{% else %}Add{% endif %} Company</h2>
</div>
<div class="card p-4" style="max-width: 600px;">
    <form method="post">
        <input type="hidden" name="_csrf" value="{{ csrfToken }}">
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label fw-bold text-muted" for="{{ field.id_for_label }}">
                {% if field.name == 'name' %}
                    Company Name
                {% elif field.name == 'role' %}
                    Job Role / Designation
                {% elif field.name == 'package' %}
                    Package Offered (LPA)
                {% else %}
                    {{ field.label }}
                {% endif %}
            </label>
            {{ field | safe }}
            {% if field.help_text %}
            <div class="form-text">{{ field.help_text }}</div>
            {% endif %}
            {% for error in field.errors %}
            <div class="text-danger small mt-1">{{ error }}</div>
            {% endfor %}
        </div>
        {% endfor %}
        <div class="mt-4 text-end">
            <a href="{{ url('') }}" class="btn btn-light border me-2">Cancel</a>
            <button type="submit" class="btn btn-primary px-4">Save Company</button>
        </div>
    </form>
</div>
{% endblock %}
